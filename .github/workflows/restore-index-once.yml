name: restore-index-once
on:
  push:
    branches: [dev]
    paths:
      - ".github/workflows/restore-index-once.yml"
jobs:
  restore:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0
      - name: Restore index.html and apply focus-border fix
        env:
          FIX_PY_B64: ""
        run: |
          set -euo pipefail
          git checkout b53509a86824b8235693db437f946bfe11abeea9 -- src/main/resources/bpmn-editor/index.html
          python3 -c "import os,base64; open('/tmp/fix.py','wb').write(base64.b64decode(os.environ['FIX_PY_B64']))"
          python3 /tmp/fix.py
          rm -f .github/workflows/restore-index-once.yml
          rm -f src/main/resources/bpmn-editor/assets/_restore_probe.txt
          rm -f src/main/resources/bpmn-editor/assets/_size_probe.css
          rm -f src/main/resources/bpmn-editor/assets/_index_part0.txt
          rm -f src/main/resources/bpmn-editor/assets/_index_part1.txt
          rm -f src/main/resources/bpmn-editor/assets/_index_part2.txt
          git config user.name "kennethIve"
          git config user.email "kennethIve@users.noreply.github.com"
          git add -A
          git status --short
          git commit -m "fix: restore index.html and drop doubled FEEL focus outline"
          git push origin HEAD:dev
