      --popup-search-focus-background-color: #1E1F22;
      --popup-tab-color: #9DA0A8;
      --popup-tab-hover-color: #DFE1E5;
      --popup-tab-active-color: #DFE1E5;
      --shape-drop-allowed-fill-color: #3A3F48;
      --shape-connect-allowed-fill-color: #3A3F48;
      --shape-drop-not-allowed-fill-color: #4A3535;
      --context-pad-entry-background-color: #2B2D30;
      --context-pad-entry-hover-background-color: #3C3F44;
    }
    html.dark .djs-popup, html.dark .djs-popup-parent, html.dark .djs-popup-body {
      background: #2B2D30 !important; color: #DFE1E5 !important; border-color: #43454A !important;
    }
    html.dark .djs-popup .entry, html.dark .djs-popup-title, html.dark .djs-popup-label { color: #DFE1E5 !important; }
    html.dark .djs-popup-search input { background: #1E1F22 !important; color: #DFE1E5 !important; border-color: #43454A !important; }
    html.dark .djs-popup-entry-docs { background: #3C3F44 !important; color: #DFE1E5 !important; border-color: #43454A !important; }
    html.dark .djs-container svg.new-parent { background: #3A3F48 !important; }
    html.dark .djs-container svg.drop-not-ok { background: #4A3535 !important; }
    #app.simulating #properties, #app.simulating #toggle-props { display: none; }
    .bpmn-lint-error { background: #c45c58; }
    .bpmn-lint-warning { background: #c4a574; }
  </style>
</head>
<body>
  <div id="app">
    <div id="canvas"></div>
    <button type="button" id="toggle-props" title="Hide properties" aria-expanded="true">‹</button>
    <aside id="properties"></aside>
  </div>
  <script src="camunda-cloud-modeler.production.min.js"></script>
  <script>
    const TASK = new Set(["task","userTask","serviceTask","sendTask","receiveTask","scriptTask","businessRuleTask","manualTask","callActivity"]);
    const NODES = new Set(["task","userTask","serviceTask","sendTask","receiveTask","scriptTask","businessRuleTask","manualTask","callActivity","startEvent","endEvent","intermediateThrowEvent","intermediateCatchEvent","boundaryEvent","exclusiveGateway","parallelGateway","inclusiveGateway","eventBasedGateway","complexGateway","subProcess"]);
    function locals(root, name) {
      return [...root.getElementsByTagName("*")].filter(function (n) { return n.localName === name; });
    }
    function attr(el, name) { return el.getAttribute(name) || ""; }
    function child(el, name) { return [...el.children].find(function (c) { return c.localName === name; }); }
    function isBpmn(el) { return !el.namespaceURI || el.namespaceURI === "http://www.omg.org/spec/BPMN/20100524/MODEL"; }
    function zeebe(el, name) {
      var ext = child(el, "extensionElements");
      if (!ext) return null;
      return [...ext.children].find(function (c) { return c.localName === name; }) || null;
    }
    function escAttr(s) {
      return String(s).replace(/[&<>"']/g, function (c) {
        if (c === "&") return "&" + "amp;";
        if (c === "<") return "&" + "lt;";
        if (c === ">") return "&" + "gt;";
        if (c === '"') return "&" + "quot;";
        return "&" + "#39;";
      });
    }
    function lintBpmnXml(xml) {
      var issues = [];
      var trimmed = (xml || "").trim();
      if (!trimmed) return [{ id: "empty", level: "error", rule: "xml", message: "Diagram is empty." }];
      var doc = new DOMParser().parseFromString(trimmed, "application/xml");
      if (doc.querySelector("parsererror")) return [{ id: "xml-parse", level: "error", rule: "xml", message: "BPMN XML is not well-formed." }];
      var definitions = locals(doc, "definitions")[0];
      if (!definitions) return [{ id: "no-definitions", level: "error", rule: "schema", message: "Missing bpmn:definitions root." }];
      var processes = locals(definitions, "process");
      if (!processes.length) return [{ id: "no-process", level: "error", rule: "schema", message: "No bpmn:process in this diagram." }];
      var ids = new Map();
      for (var el of definitions.querySelectorAll("*")) {
        var id = attr(el, "id");
        if (!id) continue;
        ids.set(id, (ids.get(id) || 0) + 1);
      }
      for (var entry of ids) {
        if (entry[1] > 1) issues.push({ id: "dup-" + entry[0], elementId: entry[0], level: "error", rule: "duplicate-id", message: "Duplicate id " + entry[0] + "." });
      }
      processes.forEach(function (process) {
        var pid = attr(process, "id") || "process";
        if (!locals(process, "startEvent").length) issues.push({ id: "no-start-" + pid, elementId: pid, level: "error", rule: "start-event", message: "Process has no start event." });
        if (!locals(process, "endEvent").length) issues.push({ id: "no-end-" + pid, elementId: pid, level: "error", rule: "end-event", message: "Process has no end event." });
        for (var task of [...process.querySelectorAll("*")].filter(function (n) { return TASK.has(n.localName) && isBpmn(n); })) {
          var tid = attr(task, "id");
          if (!attr(task, "name").trim()) issues.push({ id: "unnamed-" + tid, elementId: tid, level: "warning", rule: "task-name", message: task.localName + " should have a name." });
        }
        var defaults = new Set([...process.querySelectorAll("*")].map(function (n) { return attr(n, "default"); }).filter(Boolean));
        for (var gw of locals(process, "exclusiveGateway")) {
          var gid = attr(gw, "id");
          var outgoing = locals(gw, "outgoing").map(function (n) { return (n.textContent || "").trim(); });
          if (outgoing.length < 2) issues.push({ id: "xor-out-" + gid, elementId: gid, level: "warning", rule: "gateway", message: "Exclusive gateway should have at least two outgoing flows." });
          for (var flowId of outgoing) {
            var flow = locals(process, "sequenceFlow").find(function (f) { return attr(f, "id") === flowId; });
            if (!flow) continue;
            var named = attr(flow, "name").trim();
            var condEl = locals(flow, "conditionExpression")[0];
            var condition = condEl && (condEl.textContent || "").trim();
            if (!named && !condition && !defaults.has(flowId)) issues.push({ id: "xor-cond-" + flowId, elementId: flowId, level: "warning", rule: "flow-condition", message: "Outgoing flow from exclusive gateway needs a name, condition, or default." });
          }
        }
        for (var sf of locals(process, "sequenceFlow")) {
          var fid = attr(sf, "id");
          if (!attr(sf, "sourceRef") || !attr(sf, "targetRef")) issues.push({ id: "flow-ends-" + fid, elementId: fid, level: "error", rule: "sequence-flow", message: "Sequence flow is missing source or target." });
        }
        for (var node of [...process.querySelectorAll("*")].filter(function (n) { return NODES.has(n.localName) && isBpmn(n); })) {
          if (node.localName === "boundaryEvent") continue;
          var nid = attr(node, "id");
          var incoming = 0, outgoingN = 0;
          for (var sf2 of locals(process, "sequenceFlow")) {
            if (attr(sf2, "sourceRef") === nid) outgoingN++;
            if (attr(sf2, "targetRef") === nid) incoming++;
          }
          if (node.localName === "startEvent") { if (!outgoingN) issues.push({ id: "start-out-" + nid, elementId: nid, level: "error", rule: "disconnected", message: "Start event has no outgoing flow." }); continue; }
          if (node.localName === "endEvent") { if (!incoming) issues.push({ id: "end-in-" + nid, elementId: nid, level: "error", rule: "disconnected", message: "End event has no incoming flow." }); continue; }
          if (!incoming && !outgoingN) issues.push({ id: "orphan-" + nid, elementId: nid, level: "warning", rule: "disconnected", message: node.localName + " is not connected." });
          else if (!incoming) issues.push({ id: "no-in-" + nid, elementId: nid, level: "warning", rule: "disconnected", message: node.localName + " has no incoming flow." });
          var job = zeebe(node, "taskDefinition") ? attr(zeebe(node, "taskDefinition"), "type") : "";
          if ((node.localName === "serviceTask" || node.localName === "sendTask") && !job) {
            issues.push({ id: "job-" + nid, elementId: nid, level: "error", rule: "camunda8-job-type", message: node.localName + " needs a Zeebe job type." });
          }
        }
      });
      return issues;
    }

    var modeler = new BpmnModeler({
      container: "#canvas",
      propertiesPanel: { parent: "#properties" },
      bpmnRenderer: {"defaultFillColor":"#FFFFFF","defaultStrokeColor":"#1E1F22","defaultLabelColor":"#1E1F22"}
    });
    window.modeler = modeler;
    try {
      var grid = modeler.get("grid");
      if (grid && grid.setVisible) grid.setVisible(false);
    } catch (e) {}
    try {
      modeler.get("toggleMode");
    } catch (err) {
      console.error("token simulation module missing", err);
    }
    window.setTimeout(function () {
      if (document.querySelector(".bts-toggle-mode")) return;
      var fallback = document.createElement("button");
      fallback.type = "button";
      fallback.className = "bts-toggle-mode";
      fallback.textContent = "Token Simulation";
      fallback.addEventListener("click", function () {
        try { modeler.get("toggleMode").toggleMode(); } catch (e) {}
      });
      document.getElementById("canvas").appendChild(fallback);
    }, 0);
    var applying = false;
    var simulating = false;
    modeler.on("tokenSimulation.toggleMode", function (e) {
      simulating = !!(e && e.active);
      document.getElementById("app").classList.toggle("simulating", simulating);
    });

    function paintLint(issues) {
      var overlays = modeler.get("overlays");
      overlays.remove({ type: "lint" });
      issues.forEach(function (issue) {
        if (!issue.elementId) return;
        try {
          overlays.add(issue.elementId, "lint", {
            position: { top: -8, left: -8 },
            html: '<span class="bpmn-lint-mark bpmn-lint-' + issue.level + '" title="' + escAttr(issue.message) + '"></span>'
          });
        } catch (e) {}
      });
    }

    var persistTimer = null;
    async function flushPersist() {
      if (applying || simulating) return;
      try {
        var result = await modeler.saveXML({ format: true });
        paintLint(lintBpmnXml(result.xml));
        if (window.__onXmlChange) window.__onXmlChange(result.xml);
      } catch (err) {}
    }
    function persist() {
      if (applying || simulating) return;
      if (persistTimer) window.clearTimeout(persistTimer);
      persistTimer = window.setTimeout(flushPersist, 180);
    }

    modeler.on("commandStack.changed", persist);

    function fit() {
      try { modeler.get("canvas").zoom("fit-viewport", "auto"); } catch (e) {}
    }
    window.__fit = fit;
    window.__applyTheme = function (t) {
      var root = document.documentElement;
      var dark = !!t.dark;
      root.classList.toggle("dark", dark);
      root.classList.remove("dark-diagram");
      ["bg","panel","fg","muted","border","input","hover","accent"].forEach(function (k) {
        if (t[k]) root.style.setProperty("--" + k, t[k]);
      });
      var fill, stroke, label, canvas, panel, palette;
      if (dark) {
        canvas = t.canvas || "#1E1F22";
        panel = t.panel || "#2B2D30";
        fill = "#2B2D30";
        stroke = "#DFE1E5";
        label = "#DFE1E5";
        palette = "#2B2D30";
        root.style.setProperty("--canvas", canvas);
        root.style.setProperty("--shape-fill", fill);
        root.style.setProperty("--icon", stroke);
        root.style.setProperty("--flow", stroke);
        root.style.setProperty("--label", label);
        root.style.setProperty("--palette", palette);
        root.style.setProperty("--palette-fg", "#DFE1E5");
        root.style.setProperty("--palette-border", "#43454A");
        root.style.setProperty("--palette-hover", "#3C3F44");
        root.style.setProperty("--token-sim-on-fill", "rgba(16,208,112,.12)");
        root.style.setProperty("--token-sim-on-border", "rgba(16,208,112,.5)");
      } else {
        canvas = t.canvas || "#F7F8FA";
        panel = t.panel || "#FFFFFF";
        fill = "#FFFFFF";
        stroke = "#1E1F22";
        label = "#1E1F22";
        palette = "#FFFFFF";
        root.style.setProperty("--canvas", canvas);
        root.style.setProperty("--shape-fill", fill);
        root.style.setProperty("--icon", stroke);
        root.style.setProperty("--flow", stroke);
        root.style.setProperty("--label", label);
        root.style.setProperty("--palette", palette);
        root.style.setProperty("--palette-fg", "#1E1F22");
        root.style.setProperty("--palette-border", "#D3D5DB");
        root.style.setProperty("--palette-hover", "#EBECF0");
        root.style.setProperty("--token-sim-on-fill", "rgba(16,208,112,.12)");
        root.style.setProperty("--token-sim-on-border", "rgba(16,208,112,.55)");
      }
      if (t.bg) root.style.setProperty("--bg", t.bg);
      else root.style.setProperty("--bg", panel);
      try {
        var renderer = modeler.get("bpmnRenderer");
        if (renderer) {
          renderer.defaultFillColor = fill;
          renderer.defaultStrokeColor = stroke;
          renderer.defaultLabelColor = label;
        }
      } catch (e) {}
      try {
        var registry = modeler.get("elementRegistry");
        var gfxFactory = modeler.get("graphicsFactory");
        var canvasSvc = modeler.get("canvas");
        var rootEl = canvasSvc.getRootElement();
        registry.forEach(function (el) {
          if (!el || el === rootEl) return;
          var gfx = registry.getGraphics(el);
          if (!gfx) return;
          var type = el.waypoints ? "connection" : "shape";
          try { gfxFactory.update(type, el, gfx); } catch (err) {}
        });
      } catch (e) {}
    };
    (function setupPropsToggle() {
      var app = document.getElementById("app");
      var btn = document.getElementById("toggle-props");
      function apply(collapsed) {
        app.classList.toggle("props-collapsed", collapsed);
        btn.textContent = collapsed ? "›" : "‹";
        btn.title = collapsed ? "Show properties" : "Hide properties";
        btn.setAttribute("aria-expanded", collapsed ? "false" : "true");
        try { localStorage.setItem("forge-bpmn-props-collapsed", collapsed ? "1" : "0"); } catch (e) {}
        window.setTimeout(function () {
          try { modeler.get("canvas").resized(); } catch (e) {}
        }, 40);
      }
      apply((function () {
        try { return localStorage.getItem("forge-bpmn-props-collapsed") === "1"; } catch (e) { return false; }
      })());
      btn.addEventListener("click", function () {
        apply(!app.classList.contains("props-collapsed"));
      });
    })();
    window.addEventListener("resize", function () {
      try { modeler.get("canvas").resized(); } catch (e) {}
    });
    (function setupTrackpadZoom() {
      var el = document.getElementById("canvas");
      document.addEventListener("pointermove", function (e) {
        window.__pointerX = e.clientX;
        window.__pointerY = e.clientY;
      }, true);
      function zoomTo(scale, cx, cy) {
        try {
          var canvas = modeler.get("canvas");
          var next = Math.min(4, Math.max(0.2, scale));
          var rect = el.getBoundingClientRect();
          var x = (typeof cx === "number" && isFinite(cx)) ? cx : (window.__pointerX || (rect.left + rect.width / 2));
          var y = (typeof cy === "number" && isFinite(cy)) ? cy : (window.__pointerY || (rect.top + rect.height / 2));
          canvas.zoom(next, { x: x - rect.left, y: y - rect.top });
        } catch (e) {}
      }
      window.__zoomTo = zoomTo;
      window.__zoomBy = function (factor, x, y) {
        try {
          var n = Number(factor);
          if (!isFinite(n) || n === 0) return;
          zoomTo(modeler.get("canvas").zoom() * n, x, y);
        } catch (e) {}
      };
      window.addEventListener("wheel", function (e) {
        var pinch = e.ctrlKey || e.metaKey;
        if (!pinch) return;
        e.preventDefault();
        e.stopImmediatePropagation();
        var dy = e.deltaY;
        if (e.deltaMode === 1) dy *= 16;
        if (e.deltaMode === 2) dy *= window.innerHeight || 800;
        var dist = Math.sqrt(dy * dy + (e.deltaX || 0) * (e.deltaX || 0)) * (dy >= 0 ? 1 : -1);
        var step = e.deltaMode === 0 ? 0.015 : 0.24;
        var factor = Math.exp(-dist * step);
        if (factor < 0.5) factor = 0.5;
        if (factor > 2) factor = 2;
        window.__zoomBy(factor, e.clientX, e.clientY);
      }, { passive: false, capture: true });
      var gestureBase = 1;
      ["gesturestart", "gesturechange", "gestureend"].forEach(function (type) {
        window.addEventListener(type, function (e) {
          e.preventDefault();
          if (type === "gesturestart") {
            try { gestureBase = modeler.get("canvas").zoom(); } catch (err) { gestureBase = 1; }
          } else if (type === "gesturechange") {
            zoomTo(gestureBase * (e.scale || 1), e.clientX, e.clientY);
          }
        }, { passive: false, capture: true });
      });
      var pinchDist = 0, pinchZoom = 1;
      window.addEventListener("touchstart", function (e) {
        if (e.touches.length === 2) {
          var a = e.touches[0], b = e.touches[1];
          pinchDist = Math.hypot(a.clientX - b.clientX, a.clientY - b.clientY) || 1;
          try { pinchZoom = modeler.get("canvas").zoom(); } catch (err) { pinchZoom = 1; }
        }
      }, { passive: true, capture: true });
      window.addEventListener("touchmove", function (e) {
        if (e.touches.length !== 2) return;
        e.preventDefault();
        var a = e.touches[0], b = e.touches[1];
        var dist = Math.hypot(a.clientX - b.clientX, a.clientY - b.clientY) || 1;
        zoomTo(pinchZoom * (dist / pinchDist), (a.clientX + b.clientX) / 2, (a.clientY + b.clientY) / 2);
      }, { passive: false, capture: true });
    })();
    if (window.ResizeObserver) {
      new ResizeObserver(function () {
        try { modeler.get("canvas").resized(); } catch (e) {}
      }).observe(document.getElementById("canvas"));
    }

    window.__resized = function () {
      try { modeler.get("canvas").resized(); } catch (e) {}
    };
    window.__loadXml = async function (xml) {
      applying = true;
      var canvas = modeler.get("canvas");
      var previous = null;
      try {
        var vb = canvas.viewbox();
        if (vb && vb.width && vb.height) previous = { x: vb.x, y: vb.y, width: vb.width, height: vb.height };
      } catch (e) {}
      try {
        await modeler.importXML(xml);
        canvas.resized();
        if (previous) canvas.viewbox(previous);
        else fit();
        paintLint(lintBpmnXml(xml));
      } catch (err) {
        paintLint(lintBpmnXml(xml));
      } finally {
        applying = false;
      }
    };
  </script>
</body>
</html>
